services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - data:${DATA_DIR}
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    expose:
      - "8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - data:${DATA_DIR}
      - ./backend/app:/app/app
    depends_on:
      - api
    command: ["huey_consumer.py", "app.queue.huey", "--workers=2", "--worker-type=thread"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
