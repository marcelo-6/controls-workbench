[project]
name = "controls-workbench-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "huey>=2.6.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.uv]
# Include dev by default; you can also add lint/test here if you want.
default-groups = ["dev", "lint", "test"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic", ".venv"]

[tool.ruff.lint]
# Start strong but not annoying:
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP046", "UP047", "B008", "E402"]  # Let formatter handle wrapping

[tool.ruff.format]
# Formatter options: docs show the section and supported keys. :contentReference[oaicite:7]{index=7}
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Test discovery
pythonpath = ["."]
testpaths = ["tests"]
# addopts = "-q"
python_files = ["test_*.py"]
# python_classes = ["Test*"]
# python_functions = ["test_*"]

# Output formatting and behavior
addopts = [
    "-ra",                # show extra test summary info
    "--strict-markers",   # prevent typos in @pytest.mark
    "--strict-config",    # ensure config keys are valid
    "--disable-warnings", # cleaner output
    "--maxfail=1",        # stop after first failure

    # Coverage
    "--cov=app",                 # package to measure
    "--cov-report=term-missing", # show missing lines in terminal
    # "--cov-report=html",         # generate HTML report in htmlcov/
    # "--cov-report=xml",          # useful for CI tools

]

# Warning handling
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::UserWarning:pkg_resources",
]

# Logging (pytest's own log capture)
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(message)s"
log_date_format = "%d-%b-%y %H:%M:%S"

# Markers (must be declared when using --strict-markers)
markers = [
    "slow: marks tests as slow",
    "db: tests that require database access",
    "integration: integration-level tests",
    "unit: unit tests",
]

# exclude test files from coverage
[tool.coverage.run]
omit = [
    "tests/*",
    "app/core/*.py",
    "*/__init__.py",
]

# enforce min coverage
[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

